services:
  - type: web
    runtime: node
    name: modelgate
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: GATEWAY_KEY_PEPPER
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: PRIMARY_MODEL
        value: gemini-3.8-flash
      - key: REQUEST_TIMEOUT_MS
        value: "20000"
      - key: REDIS_URL
        sync: false
      - key: RATE_LIMIT_REQUESTS_PER_MINUTE
        value: "10"
      - key: PRIMARY_INPUT_COST_PER_1M_USD
        value: "0.75"
      - key: PRIMARY_OUTPUT_COST_PER_1M_USD
        value: "3.75"
